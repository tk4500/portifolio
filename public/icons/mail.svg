<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mail-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="envelope-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="letter-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <filter id="mail-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#mail-bg)" />
  <rect x="6" y="6" width="52" height="52" rx="16" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <g filter="url(#mail-shadow)">
    <!-- Letter Peeking Out -->
    <rect x="18" y="15" width="28" height="20" rx="2" fill="url(#letter-grad)" stroke="#FDE68A" stroke-width="1" />
    <line x1="22" y1="20" x2="32" y2="20" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" />
    <line x1="22" y1="24" x2="42" y2="24" stroke="#D97706" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />

    <!-- Main Envelope Pocket -->
    <path d="M14 26 C14 23.5, 16 22, 18.5 22 H45.5 C48 22, 50 23.5, 50 26 V44 C50 47, 48 49, 45 49 H19 C16 49, 14 47, 14 44 Z" fill="url(#envelope-body)" />

    <!-- Folded Envelope Seams -->
    <path d="M14 26 L32 37 L50 26" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M14 46 L27 34 M50 46 L37 34" stroke="#E2E8F0" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Notification dot -->
  <circle cx="48" cy="16" r="5" fill="#22C55E" stroke="#FFFFFF" stroke-width="2" />
</svg>
