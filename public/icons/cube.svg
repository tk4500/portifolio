<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cube-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="cube-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#cube-bg)" />
  <rect x="6" y="6" width="52" height="52" rx="16" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <g filter="url(#cube-shadow)">
    <!-- 3D Isometric Package / App Box -->
    <polygon points="32 15, 47 23.5, 32 32, 17 23.5" fill="url(#cube-top)" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round" />
    <polygon points="17 23.5, 32 32, 32 48, 17 39.5" fill="url(#cube-left)" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round" />
    <polygon points="32 32, 47 23.5, 47 39.5, 32 48" fill="#3730A3" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Center Package Seam Line -->
    <line x1="32" y1="32" x2="32" y2="48" stroke="#FFFFFF" stroke-width="1" opacity="0.6" />
  </g>

  <!-- Code/App Sparkle Badge -->
  <circle cx="46" cy="46" r="7" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2" />
  <path d="M43 45 L45 47 L49 43" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
