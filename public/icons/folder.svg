<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="folder-tab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="folder-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="folder-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="sheet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="folder-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>

  <g filter="url(#folder-shadow)">
    <!-- Back folder body with top tab -->
    <path d="M10 20 C10 16.5, 12.5 14, 16 14 H26 C28.5 14, 30.5 15.5, 32 18 L34.5 21 C35.5 22, 37 23, 38.5 23 H48 C51.5 23, 54 25.5, 54 29 V46 C54 49.5, 51.5 52, 48 52 H16 C12.5 52, 10 49.5, 10 46 Z" fill="url(#folder-back)" />

    <!-- Project Blueprint Sheet peeking out -->
    <rect x="18" y="16" width="28" height="24" rx="2.5" fill="url(#sheet-grad)" stroke="#E2E8F0" stroke-width="1" />
    <line x1="23" y1="22" x2="33" y2="22" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" />
    <line x1="23" y1="27" x2="41" y2="27" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="23" y1="31" x2="37" y2="31" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Front folder pocket with 3D slope -->
    <path d="M8 29 C8 26.5, 10 24.5, 12.5 24.5 H51.5 C54 24.5, 56 26.5, 56 29 L54 47 C54 50, 51.5 52, 48.5 52 H15.5 C12.5 52, 10 50, 10 47 Z" fill="url(#folder-front)" />
    <!-- Gloss highlight along top rim -->
    <path d="M10 27 H54" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" />

    <!-- Front OS project badge symbol -->
    <circle cx="32" cy="38" r="5" fill="#B45309" opacity="0.25" />
    <rect x="29.5" y="35.5" width="5" height="5" rx="1" fill="#FFFFFF" />
  </g>
</svg>
