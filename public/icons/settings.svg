<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="settings-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="gear-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="settings-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#settings-bg)" />
  <rect x="6" y="6" width="52" height="52" rx="16" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Outer Cog Gear -->
  <g filter="url(#settings-shadow)" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" fill="rgba(255,255,255,0.1)">
    <!-- 8-tooth gear path -->
    <path d="M29 16 h6 l1.5 4 a12 12 0 0 1 3.5 1.5 l4 -1.5 l4 4 l-1.5 4 a12 12 0 0 1 1.5 3.5 l4 1.5 v6 l-4 1.5 a12 12 0 0 1 -1.5 3.5 l1.5 4 l-4 4 l-4 -1.5 a12 12 0 0 1 -3.5 1.5 l-1.5 4 h-6 l-1.5 -4 a12 12 0 0 1 -3.5 -1.5 l-4 1.5 l-4 -4 l1.5 -4 a12 12 0 0 1 -1.5 -3.5 l-4 -1.5 v-6 l4 -1.5 a12 12 0 0 1 1.5 -3.5 l-1.5 -4 l4 -4 l4 1.5 a12 12 0 0 1 3.5 -1.5 z" fill="#FFFFFF" fill-opacity="0.95" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="32" cy="32" r="7" fill="url(#settings-bg)" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Slider / Toggle Control Accent Badge -->
  <circle cx="44" cy="44" r="7.5" fill="url(#gear-accent)" stroke="#FFFFFF" stroke-width="2" />
  <!-- Sliders lines inside badge -->
  <line x1="39" y1="42" x2="49" y2="42" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="42" cy="42" r="1.5" fill="#FFFFFF" />
  <line x1="39" y1="46" x2="49" y2="46" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="46" cy="46" r="1.5" fill="#FFFFFF" />
</svg>
