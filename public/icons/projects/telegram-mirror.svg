<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="telegram-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="paper-plane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>
    <filter id="telegram-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#telegram-bg)" />
  <rect x="6" y="6" width="52" height="52" rx="16" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <g filter="url(#telegram-shadow)">
    <!-- Telegram Paper Airplane Flight Trajectory -->
    <path d="M47 17 L15 30 L26 36 L40 24 L29 39 L43 46 Z" fill="url(#paper-plane)" />
    <!-- Wing fold shadow -->
    <path d="M26 36 L29 39 L40 24 Z" fill="#BAE6FD" />
  </g>

  <!-- Sync / Mirror Clone Badge -->
  <circle cx="46" cy="46" r="7" fill="#0284C7" stroke="#FFFFFF" stroke-width="2" />
  <!-- Dual sync arrows -->
  <path d="M43 44 A 3 3 0 0 1 48 43 L49 42 M49 48 A 3 3 0 0 1 44 49 L43 50" stroke="#38BDF8" stroke-width="1.3" stroke-linecap="round" fill="none" />
</svg>
