<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="portfolio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="win-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="portfolio-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#portfolio-bg)" />
  <rect x="6" y="6" width="52" height="52" rx="16" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <g filter="url(#portfolio-shadow)">
    <!-- Back Window Shadow Silhouette -->
    <rect x="15" y="16" width="28" height="20" rx="3" fill="#C2410C" opacity="0.6" />

    <!-- Front Active OS Window -->
    <rect x="20" y="22" width="28" height="22" rx="3" fill="url(#win-glass)" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Titlebar -->
    <path d="M20 25 C20 23.5, 21.5 22, 23 22 H45 C46.5 22, 48 23.5, 48 25 V27 H20 Z" fill="#E2E8F0" />
    <!-- Window Traffic Lights -->
    <circle cx="24" cy="24.5" r="1.2" fill="#EF4444" />
    <circle cx="27" cy="24.5" r="1.2" fill="#F59E0B" />
    <circle cx="30" cy="24.5" r="1.2" fill="#10B981" />

    <!-- Window Content Layout Simulation -->
    <line x1="24" y1="31" x2="33" y2="31" stroke="#F97316" stroke-width="1.8" stroke-linecap="round" />
    <line x1="24" y1="35" x2="44" y2="35" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
    <line x1="24" y1="39" x2="40" y2="39" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Interactive Cursor Badge -->
  <circle cx="46" cy="46" r="7.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2" />
  <!-- OS pointer arrow -->
  <path d="M43 42 L43 49 L45 47 L48 50 L49 49 L46 46 L49 46 Z" fill="#FFFFFF" />
</svg>
