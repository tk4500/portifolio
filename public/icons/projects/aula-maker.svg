<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="aula-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
    <linearGradient id="chalkboard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#ECFEFF" />
    </linearGradient>
    <filter id="aula-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#aula-bg)" />
  <rect x="6" y="6" width="52" height="52" rx="16" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <g filter="url(#aula-shadow)">
    <!-- Lesson Planner Sheet / Document -->
    <rect x="17" y="15" width="30" height="36" rx="4" fill="url(#chalkboard)" />
    <!-- Lesson Header -->
    <rect x="22" y="21" width="14" height="3" rx="1.5" fill="#0891B2" />
    <!-- Plan Lines -->
    <line x1="22" y1="28" x2="41" y2="28" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="22" y1="33" x2="38" y2="33" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="22" y1="38" x2="32" y2="38" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- AI Teacher Sparkle / Magic Wand Badge -->
  <circle cx="45" cy="45" r="7.5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2" />
  <path d="M45 40 L46 43 L49 44 L46 45 L45 48 L44 45 L41 44 L44 43 Z" fill="#FFFFFF" />
</svg>
