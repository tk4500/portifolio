<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="firecast-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="d20-facet-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <linearGradient id="d20-facet-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="firecast-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#firecast-bg)" />
  <rect x="6" y="6" width="52" height="52" rx="16" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <g filter="url(#firecast-shadow)">
    <!-- 3D D20 Polyhedral Die Silhouette -->
    <!-- Outer Hexagon Base -->
    <polygon points="32 14, 48 23, 48 41, 32 50, 16 41, 16 23" fill="url(#d20-facet-dark)" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Center Triangular Face -->
    <polygon points="32 24, 42 38, 22 38" fill="url(#d20-facet-light)" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Connecting Facet Ribs -->
    <line x1="32" y1="14" x2="32" y2="24" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="16" y1="23" x2="22" y2="38" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="48" y1="23" x2="42" y2="38" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="32" y1="14" x2="22" y2="38" stroke="#FFFFFF" stroke-width="1" opacity="0.6" />
    <line x1="32" y1="14" x2="42" y2="38" stroke="#FFFFFF" stroke-width="1" opacity="0.6" />
    <line x1="32" y1="50" x2="22" y2="38" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="32" y1="50" x2="42" y2="38" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- Nat 20 Critical Roll -->
    <text x="32" y="34.5" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#B45309" text-anchor="middle">20</text>
  </g>

  <!-- Flame Magic Spark Accent -->
  <circle cx="46" cy="18" r="6" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5" />
  <path d="M46 15 C47 17, 49 18, 48 20 C47 21, 45 21, 44 20 C43 19, 44 17, 46 15 Z" fill="#FDE047" />
</svg>
